# ---- Network ----
# 0.0.0.0 = accept connections from other machines on the hotspot (the ESP32), not just this Mac.
server.address=0.0.0.0
server.port=8080

# ---- The test device ----
# The ESP32 firmware must send exactly these in X-Device-Id / X-Device-Key.
# Replace the key with the one the software team gives you, so firmware does not change later.
fake.device.id=VM-0001
fake.device.key=test-secret-0001

# ---- Rules (from the integration guide, section 2 and 8) ----
fake.session.seconds=300
fake.moisture.min=5.0
fake.moisture.max=40.0
fake.temp.min=-10.0
fake.temp.max=70.0

# ---- Defaults used when you start a test from the dashboard / curl ----
fake.default.farmer-name=Nimal
fake.timezone=Asia/Colombo

spring.main.banner-mode=off
logging.level.root=WARN
logging.level.lk.veemarket=INFO
